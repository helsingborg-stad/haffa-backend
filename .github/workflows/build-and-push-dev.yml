name: Build and push docker image to github registry and deploy on dev environment.

on:
    push:
        branches:
            - dev
            - petter-a-patch-1

permissions:
    contents: read
    packages: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: ./.github/workflows/docker-build.yml
            with:
              extra-image-tags: |
                type=raw,value=${{github.event.release.tag_name}}
                    
