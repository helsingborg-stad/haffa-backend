name: Tests
on:
  pull_request:

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  tests:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: setup npm
        run: |
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: npm install
        run: npm ci

      - name: run tests
        run: npm run test-ci

      - name: Save output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage
