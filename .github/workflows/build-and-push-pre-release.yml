name: Build and push docker image to github registry and deploy on release environment.

on:
    release:
        types: [prereleased]

permissions:
    contents: write
    packages: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: ./.github/workflows/docker-build.yml
              with:
                  update-package-version: true
                  
