name: Build and push docker image to github registry and deploy on release environment.

on:
    release:
        types: [prereleased]

permissions:
    contents: write
    packages: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - uses: helsingborg-stad/gdi-deploy/v2@main
              with:
                  update-package-version: true
                  release-tag-name: ${{github.event.release.tag_name}}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  git-checkout-branch: dev
                  docker-username: ${{ github.repository_owner }}
                  docker-password: ${{ secrets.GITHUB_TOKEN }}
                  
