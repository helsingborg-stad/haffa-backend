name: GDI Deploy 2.0
description: Set version, build and push docker image to github registry for a gdi service.

inputs:
  update-package-version:
    description: If the version of package.json should be updated.
    required: false
    type: boolean

  release-tag-name:
    description: The tag that was just released
    required: true
    type: string

  github-token:
    description: GitHub Token  
    required: true
    type: string

  docker-username:
    description: Username to use when logging in to the docker registry
    required: true
    type: string
  
  docker-password:
    description: Password to use when logging in to the docker registry
    required: true
    type: string

  docker-no-cache:
    description: If we should not use cache when building.
    required: false
    default: false
    type: boolean

  extra-build-args:
    description: 'Extra build arguments to pass to Docker'
    required: false
    default: ''

  extra-image-tags:
    description: 'Extra tags to put on the docker image'
    required: false
    default: ''

  git-checkout-branch:
    description: The branch to checkout for building
    required: false
    default: main

runs:
  using: composite
  steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-checkout-branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set package.json version
        if: inputs.update-package-version == 'true'
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}
        run: npm version --allow-same-version --no-git-tag-version "$RELEASE_TAG_NAME"

      - name: Commit and push
        if: inputs.update-package-version == 'true'
        shell: bash
        env:
          GIT_CHECKOUT_BRANCH: ${{ inputs.git-checkout-branch }}
          RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add --all
          git diff --cached --quiet || git commit -m "🔖 Set versions to release tag ${RELEASE_TAG_NAME}"
          git push --force-with-lease origin "HEAD:refs/heads/${GIT_CHECKOUT_BRANCH}"

      - name: Repository Variable to Lowercase
        id: string
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "lowercase=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.docker-username }}
          password: ${{ inputs.docker-password }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          github-token: ${{ inputs.github-token }}
          images: ghcr.io/${{ steps.string.outputs.lowercase }}
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha
            type=sha,format=long
            ${{ inputs.extra-image-tags }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.docker-no-cache }}
          build-args: |
            GITHUB_ACCESS_TOKEN=${{ inputs.github-token }}
            ${{ inputs.extra-build-args }}
